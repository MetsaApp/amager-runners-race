# Sponsors / partners, grouped into three tiers of visual prominence.
# Each tier gets its own grid row with its own column counts.
#   - main:     Hovedsponsor (10.000 DKK)            — largest cells
#   - standard: Sponsor      (5.000 DKK or in-kind)  — medium cells
#   - partner:  Små sponsorer / partnere             — small, dense grid
# Add a sponsor by appending to the relevant tier's `items`. Set
# `image` to /img/yourlogo.png and `url` to their site; entries with no
# image fall back to rendering the brand name as text.

tiers:
  - id: main
    cols: 1
    colsMobile: 1
    items:
      - name: "Kjærulf Rammer"
        url: ""
        image: "/img/kjærulff.png"   # logo file pending — text fallback until it arrives

  - id: standard
    cols: 3
    colsMobile: 2
    items:
      - name: "Sparekassen Danmark"
        url: "https://www.spard.dk/"
        image: "/img/sparekassen-danmark.jpg"
      - name: "Rema 1000"
        url: ""
        image: ""

  - id: partner
    cols: 5
    colsMobile: 3
    items:
      - name: "Yellow Bird"
        url: "https://yellowbirdcoffee.dk/"
        image: "/img/YellowBirdLogo.png"
      - name: "Dansk Atletik"
        url: "https://dansk-atletik.dk"
        image: "/img/daf.jpg"
      - name: "Amager Strandpark parkrun"
        url: "https://www.parkrun.dk/amagerstrandpark/"
        image: "/img/parkrun.png"