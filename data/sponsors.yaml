# Sponsors / partners. Adjust grid via `cols` and `colsMobile`.
# Add a sponsor by appending to `items`. Set `image` to /img/yourlogo.png
# and `url` to their site; placeholder cards show `name`.
cols: 4
colsMobile: 2

items:
  - name: "Dansk Atletik"
    url: "https://dansk-atletik.dk"
    image: "/img/daf.jpg"
  - name: "Sparekassen Danmark"
    url: "https://www.spard.dk/"
    image: "/img/sparekassen-danmark.jpg"
  - name: "MetaLine ApS"
    url: ""
    image: ""
  - name: ""        # blank name → renders "Your logo?" placeholder
    url: ""
    image: ""
    placeholder: true
