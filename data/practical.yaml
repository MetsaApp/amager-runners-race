# Practical info cards. Grid columns adjustable via `cols`.
# Add a new card by appending to `cards`.
cols: 4          # desktop columns
colsMobile: 2    # mobile columns

cards:
  - icon: "P"
    title:
      en: "Parking"
      da: "Parkering"
    body:
      en: "Parking at {location}, north and south. Spaces are limited, so take the Metro to Øresund (4 min walk) if you can."
      da: "Parkering ved {location}, nord og syd. Pladserne er begrænsede, så tag Metroen til Øresund (4 min. gang), hvis du kan."

  - icon: "B"
    title:
      en: "Bag drop"
      da: "Taskeaflevering"
    body:
      en: "Staffed bag drop at Tiøren. Show your bib to pick up."
      da: "Bemandet taskeaflevering ved Tiøren. Vis dit startnummer ved afhentning."

  - icon: "H"
    title:
      en: "Water"
      da: "Vand"
    body:
      en: "One water station at the start and finish. 10K runners pass it at halfway."
      da: "Én drikkestation ved start og mål. 10K-løbere passerer den halvvejs."

  - icon: "M"
    title:
      en: "First aid"
      da: "Førstehjælp"
    body:
      en: "First aid at the start and finish, and at the 5K mark for 10K runners."
      da: "Førstehjælp ved start og mål, og ved 5K-mærket for 10K-løbere."

  - icon: "C"
    title:
      en: "Chip timing"
      da: "Chiptidtagning"
    body:
      en: "Chip timing is included. More details closer to race day."
      da: "Chiptidtagning er inkluderet. Flere detaljer tættere på løbsdagen."
