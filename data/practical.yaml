# Practical info cards. Grid columns adjustable via `cols`.
# Add a new card by appending to `cards`.
cols: 4 # desktop columns
colsMobile: 2 # mobile columns

cards:
  - icon: "P"
    title:
      en: "Parking"
      da: "Parkering"
    body:
      en: "Parking at Amager Strandpark, but limited spaces. Better to take a bike or the metro to Amager Strand or Femøren."
      da: "Parkering ved Amager Strandpark, men begrænsede pladser. Det er bedre at tage cyklen eller metroen til Amager Strand eller Femøren"
  - icon: "B"
    title:
      en: "Bag drop"
      da: "Taskeaflevering"
    body:
      en: "Staffed bag drop at the start/finish area. Show your bib to pick up."
      da: "Bemandet taskeaflevering i start/mål området. Vis dit startnummer ved afhentning."

  - icon: "H"
    title:
      en: "Water"
      da: "Vand"
    body:
      en: "One water station at the start and finish. 10K runners pass it at halfway."
      da: "Én drikkestation ved start og mål. 10K-løbere passerer den halvvejs."

  - icon: "M"
    title:
      en: "First aid"
      da: "Førstehjælp"
    body:
      en: "First aid at the start and finish, and at the 5K mark for 10K runners."
      da: "Førstehjælp ved start og mål, og ved 5K-mærket for 10K-løbere."

  - icon: "C"
    title:
      en: "Chip timing"
      da: "Chiptidtagning"
    body:
      en: "Chip timing is included. More details closer to race day."
      da: "Chiptidtagning er inkluderet. Flere detaljer tættere på løbsdagen."
  
  - icon: "Z"
    title:
      en: "Prizes"
      da: "Præmier"
    body:
      en: "Prizes for the top 3 women and men in both 5K and 10K. Additionally, there will be raffle prizes for all participants."
      da: "Præmier til top 3 kvinder og mænd på både 5 km og 10 km. Derudover udloddes lodtrækningspræmier blandt alle deltagere."
  
  - icon: "R"
    title:
      en: "The route"
      da: "Ruten"
    body:
      en: "A fast and spectator-friendly route along the water at Amager Strandpark, starting and finishing at Femøren by the sea."
      da: "En hurtig og tilskuervenlig rute langs vandet i Amager Strandpark med start og mål ved Femøren ud mod havet"
