# Practical info cards. Grid columns adjustable via `cols`.
# Add a new card by appending to `cards`.
cols: 4          # desktop columns
colsMobile: 2    # mobile columns

cards:
  - icon: "P"
    title:
      en: "Parking"
      da: "Parkering"
    body:
      en: "Free parking at {location}, north and south. Spaces are limited, so take the Metro to Øresund (4 min walk) if you can."
      da: "Gratis parkering ved {location}, nord og syd. Pladserne er begrænsede, så tag Metroen til Øresund (4 min. gang), hvis du kan."

  - icon: "B"
    title:
      en: "Bag drop"
      da: "Taskeaflevering"
    body:
      en: "Staffed bag drop at Helgoland Badeanstalt from {checkin} to {bagDropEnd}. Show your bib to pick up."
      da: "Bemandet taskeaflevering ved Helgoland Badeanstalt fra {checkin} til {bagDropEnd}. Vis dit startnummer ved afhentning."

  - icon: "H"
    title:
      en: "Water"
      da: "Vand"
    body:
      en: "One water station at the start and finish. 10K runners pass it at halfway. Cups are compostable."
      da: "Én drikkestation ved start og mål. 10K-løbere passerer den halvvejs. Kopperne er komposterbare."

  - icon: "M"
    title:
      en: "First aid"
      da: "Førstehjælp"
    body:
      en: "First aid at the start and finish, and at the 5K mark for 10K runners. Emergency number is printed on the back of your bib."
      da: "Førstehjælp ved start og mål, og ved 5K-mærket for 10K-løbere. Nødnummer står bag på startnummeret."

  - icon: "C"
    title:
      en: "Chip timing"
      da: "Chiptidtagning"
    body:
      en: "Disposable chip on the back of your bib. Nothing to return. Live results at {domain} from {resultsLive}."
      da: "Engangschip bag på startnummeret. Skal ikke afleveres. Live-resultater på {domain} fra {resultsLive}."
