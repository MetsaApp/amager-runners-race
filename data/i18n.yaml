  intro:
    sectionLabel: "Om løbet"
    sectionTitle: "Løb langs kysten"
    label: "Åbent for alle."
    lead: "EN FLAD, HURTIG OG FLOT RUTE LANGS KYSTEN. Løb 5 KM ELLER 10 KM I AMAGER STRANDPARK."
    startsSentence: "{dist0} og {dist1} starter samtidig klokken {time0}."
    body: |
      Er du i gang med de sidste forberedelser frem mod VM i halvmaraton i København? Eller har du bare lyst til at udfordre dig selv på en hurtig og flot rute?<br><br>
      Vælg mellem 5 km og 10 km på en DAF-opmålt rute gennem Amager Strandparks smukke omgivelser. De flade stier langs kysten giver optimale muligheder for at jagte en personlig rekord – uanset om du er erfaren løber eller motionist.<br><br>
      Alle niveauer er velkomne. Kom alene eller tag din bedste løbebuddy med og oplev fællesskabet omkring løb på Amager.<br><br>
      Chiptidtagning er inkluderet, og der vil være vand ved start og mål. Løbet arrangeres af Amager Runners med støtte fra Dansk Atletik Forbund. Et eventuelt overskud går til klubbens arbejde med at skabe løbeglæde og fællesskab på Amager.
