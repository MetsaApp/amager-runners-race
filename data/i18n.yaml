    label: "Open to everyone."
    lead: "A FLAT, FAST AND SCENIC ROUTE ALONG THE COAST. RUN 5 KM OR 10 KM IN AMAGER STRANDPARK."
    startsSentence: "{dist0} and {dist1} start together at {time0}."
    body: |
      Are you putting the finishing touches on your preparations for the World Athletics Half Marathon Championships in Copenhagen? Or are you simply looking to challenge yourself on a fast and scenic course?<br><br>
      Choose between 5 km and 10 km on a certified course through the beautiful surroundings of Amager Strandpark. The flat coastal paths provide the perfect opportunity to chase a personal best, whether you're an experienced runner or just getting started.<br><br>
      Runners of all levels are welcome. Come on your own or bring your favourite running buddy and experience the running community of Amager.<br><br>
      Chip timing is included, and water will be available at the start and finish area. The race is organised by Amager Runners with support from the Danish Athletics Federation. Any surplus from the event will be reinvested in the club's work to promote running, community, and active lifestyles on Amager.
