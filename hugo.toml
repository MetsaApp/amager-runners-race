baseURL = "https://race.amagerrunners.dk/"
title = "Strandparkløbet Amager"
locale = "en"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
enableEmoji = false
enableGitInfo = false
canonifyURLs = false
summaryLength = 30
timeout = "60s"

# Single-page site — disable unused page kinds
disableKinds = ["taxonomy", "term", "section"]

# Sitemap defaults
[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[minify]
  minifyOutput = true
  [minify.tdewolff.html]
    keepWhitespace = false

[markup]
  [markup.goldmark.renderer]
    unsafe = true

[outputs]
  home = ["HTML", "RSS"]

# ----------------- LANGUAGES -----------------
[languages]
  [languages.en]
    label = "English"
    locale = "en"
    weight = 1
    [languages.en.params]
      # description comes from content/_index.md front matter; title from top-level.
      ogLocale = "en_GB"

  [languages.da]
    label = "Dansk"
    locale = "da"
    weight = 2
    contentDir = "content/da"
    [languages.da.params]
      # description comes from content/da/_index.md front matter; title from top-level.
      ogLocale = "da_DK"

# ----------------- SITE PARAMS -----------------
[params]
  # Core event details — change once, used everywhere. Event name uses top-level title.
  eventDate = "2026-09-03"
  # eventDateDisplay (DD.MM.YYYY) is derived from eventDate via time.Format in templates.
  # eventDateLong stays explicit because Hugo's time.Format doesn't localize month/weekday names.
  eventDateLong = { en = "Thursday 3 September 2026", da = "Torsdag 3. september 2026" }
  # Start times come from data/schedule.yaml (rows with kind.en = "Start").
  # Event geo coords come from the first point in data/route.yaml.
  eventEndTime = "21:30"
  location = "Amager Strandpark"
  organiser = "Amager Runners"
  organiserUrl = "https://amagerrunners.dk"
  organiserEmail = "info@amagerrunners.dk"
  #organiserStreet = "Erantisvej 28"
  #organiserPostalCode = "2300"
  #organiserLocality = "København S"
  organiserCVR = "44864932"
  registrationStatus = "open"
  # NOTE: maxRunners is also referenced in content/_index.md and content/da/_index.md
  # front-matter descriptions, which can't read params. Update those by hand.
  maxRunners = 900
  priceDKK = 180
  currency = "DKK"
  # SEO defaults
  ogImage = "/img/hero.jpg"
  twitterHandle = "@amagerrunners"
  themeColor = "#0B0D10"

  # Design tweak defaults (editable per build)
  accent = "blue"
  fonts = "athletic"
  heroLayout = "image"

  [params.social]
    website = "https://amagerrunners.dk/"
    strava = "https://strava.com/clubs/amagerrunners"
    facebook = "https://www.facebook.com/groups/992359708926135"
